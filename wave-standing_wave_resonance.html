<script>
var rwSim0922 = (function(){
var canvas  = document.getElementById('rwCanvas0922');
var ctx     = canvas.getContext('2d');
var CW = canvas.width, CH = canvas.height;
var xBase = 80, yBase = 75, centerY = yBase + 90;
var varFont = '12pt Calibri';
var yScale = 4;
var xFar = xBase + 500;
var dotStep = 3;
var L_m = 1.6;                         /* rope length in metres -- fixed, matches a typical lab string */
var MIN_DENOM = 0.06;                  /* clamps the resonance peak to a finite (but dramatic) height,
standing in for real damping instead of a literal divide-by-zero */
var A0 = 2, freq = 20, endType = 'fixed';
var Tension = 150, mu = 25;
var t = 0.0, tactual = 25.0, runRate = 30;
var index = -1, runFlag = 0, timer = null;
var mx = CW / 2, my = CH / 2 + 50;
var px = 0, py = 0;
var hw = 40, hh = (41 / 65) * hw;
var v, k, omega, denom, gain, nearRes = false;
function recompute() {
v = Math.sqrt(1000 * Tension / mu);              /* m/s, same formula as the pulse sim */
omega = 2 * Math.PI * freq;
k = omega / v;
var raw = (endType === 'fixed') ? Math.sin(k * L_m) : Math.cos(k * L_m);
var sgn = raw < 0 ? -1 : 1;
denom = sgn * Math.max(Math.abs(raw), MIN_DENOM);
gain = 1 / Math.abs(denom);
updateNearResonance();
}
function predictedHarmonics(n) {
/* returns [f1..fn] for the CURRENT v, L, end type */
var arr = [];
for (var i = 1; i <= n; i++) {
arr.push((endType === 'fixed') ? (i * v) / (2 * L_m) : ((2 * i - 1) * v) / (4 * L_m));
}
return arr;
}
function nearestHarmonicNumber() {
return (endType === 'fixed') ? Math.max(1, Math.round(freq * 2 * L_m / v))
: Math.max(1, Math.round((freq * 4 * L_m / v + 1) / 2));
}
function updateNearResonance() {
var maxGain = 1 / MIN_DENOM;
var wasNear = nearRes;
nearRes = gain > 0.6 * maxGain;
if (nearRes && !wasNear) {
rwA11y0922.narrate('Resonance! This looks like harmonic n=' + nearestHarmonicNumber() + '.');
}
}
/* ── displacement, x in canvas px, x' = x - xBase measured from the driven end ── */
function displacement(x) {
var xp = x - xBase;
var shape;
if (endType === 'fixed') shape = Math.sin(k * (L_m - xp / 500 * L_m)) / denom;
else                     shape = Math.cos(k * (L_m - xp / 500 * L_m)) / denom;
return A0 * shape * Math.sin(omega * t);
}
/* node x-positions (in canvas px) for the current mode shape, independent of the resonance clamp */
function nodePositions() {
var nodes = [];
var maxM = 60;
for (var m0 = 0; m0 <= maxM; m0++) {
var xpm;
if (endType === 'fixed') xpm = L_m - m0 * Math.PI / k;
else                     xpm = L_m - (2 * m0 - 1) * Math.PI / (2 * k);
if (xpm >= -1e-9 && xpm <= L_m + 1e-9) {
var xPix = xBase + (xpm / L_m) * 500;
if (xPix >= xBase - 1 && xPix <= xFar + 1) nodes.push(clamp(xPix, xBase, xFar));
}
}
return nodes;
}
var addXCalFlag = 0, addYCalFlag = 0, showMarkerFlag = 0, showNodesFlag = 1, showWaveDataFlag = 1;
var xCal = { by: 260, x1: xBase + 40, x2: xBase + 190, jawH: 22, box: null };
var yCal = { bx: xBase + 380, y1: centerY - 60, y2: centerY + 60, jawW: 22, box: null };
var dragging = null;
var mWLength = '0.00', m2Amp = '0.0';
var markedXs = [xBase + 100, xBase + 250, xBase + 400];
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function arrow(x1, y1, x2, y2, w, col, txt, spc) {
if (!w) w = 1;
if (!txt) txt = '';
if (!spc) spc = 5;
if (!col) col = ctx.strokeStyle;
ctx.fillStyle = col; ctx.strokeStyle = col;
var dx = x2 - x1, dy = y2 - y1;
var length = Math.sqrt(dx * dx + dy * dy);
if (length === 0) return;
dx /= length; dy /= length;
var s = 2.5 * w + 7.5;
var xSp = x2 - s * dx, ySp = y2 - s * dy;
var h = 0.5 * w + 3.5;
var xSp1 = xSp - h * dy, ySp1 = ySp + h * dx;
var xSp2 = xSp + h * dy, ySp2 = ySp - h * dx;
xSp = x2 - 0.6 * s * dx; ySp = y2 - 0.6 * s * dy;
ctx.beginPath(); ctx.lineWidth = w; ctx.moveTo(x1, y1);
if (length < 5) ctx.lineTo(x2, y2); else ctx.lineTo(xSp, ySp);
ctx.stroke();
if (length < 5) return;
ctx.beginPath(); ctx.fillStyle = ctx.strokeStyle;
ctx.moveTo(xSp, ySp); ctx.lineTo(xSp1, ySp1); ctx.lineTo(x2, y2); ctx.lineTo(xSp2, ySp2);
ctx.closePath(); ctx.fill();
}
function arrowDraw(r0, phiA) {
var xf = px + r0 * Math.cos(phiA);
var yf = py - r0 * Math.sin(phiA);
arrow(px, py, xf, yf, 3);
}
function addGrid(h, w, dh, dw, x0, y0, col) {
if (!x0) x0 = 0; if (!y0) y0 = 0; if (!col) col = '#ccc';
ctx.strokeStyle = col; ctx.lineWidth = 0.3;
var maxV = parseInt(h / dh), maxH = parseInt(w / dw);
for (var i = 1; i < maxV; i++) { ctx.beginPath(); ctx.moveTo(x0, y0 + dw * i); ctx.lineTo(x0 + w, y0 + dw * i); ctx.stroke(); }
for (var j = 1; j < maxH; j++) { ctx.beginPath(); ctx.moveTo(x0 + dw * j, y0); ctx.lineTo(x0 + dw * j, y0 + h); ctx.stroke(); }
}
function addXYaxis(h, w, x0, y0, col) {
if (!col) col = 'black';
ctx.strokeStyle = col; ctx.font = '16pt Calibri'; ctx.fillStyle = col; ctx.textAlign = 'left';
px = 0; py = y0; arrowDraw(0.99 * w, 0); ctx.fillText('x', 0.95 * w, 1.1 * y0);
px = x0; py = h; arrowDraw(0.99 * h, Math.PI / 2); ctx.fillText('y', 0.8 * x0, 0.05 * h);
}
function drawDot(cx, cy, r0, col) {
ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1;
ctx.beginPath(); ctx.arc(cx, cy, r0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
}
function drawRope() {
var col = rwA11y0922.col('rope');
var markerCol = rwA11y0922.col('marker');
var rr = clamp(mu / 10, 1.5, 4);
for (var x = xBase; x <= xFar; x += dotStep) {
var yRaw = centerY + yScale * displacement(x);
var y = clamp(yRaw, 4, CH - 4);
drawDot(x, y, rr, col);
if (showMarkerFlag) {
for (var m = 0; m < markedXs.length; m++) {
if (Math.abs(x - markedXs[m]) < dotStep / 2) {
ctx.beginPath(); ctx.arc(x, y, rr + 4, 0, 2 * Math.PI);
ctx.lineWidth = 2; ctx.strokeStyle = markerCol; ctx.stroke();
}
}
}
}
}
function drawNodes() {
if (!showNodesFlag) return;
var col = rwA11y0922.col('node');
var nodes = nodePositions();
for (var i = 0; i < nodes.length; i++) {
ctx.beginPath(); ctx.moveTo(nodes[i], centerY - 46); ctx.lineTo(nodes[i], centerY + 46);
ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
drawDot(nodes[i], centerY, 4, col);
}
}
function drawEnd(col) {
ctx.strokeStyle = col; ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(xFar, yBase - 40); ctx.lineTo(xFar, yBase + 200); ctx.stroke();
if (endType === 'fixed') {
ctx.lineWidth = 3;
for (var yy = yBase - 40; yy < yBase + 200; yy += 14) {
ctx.beginPath(); ctx.moveTo(xFar, yy); ctx.lineTo(xFar + 12, yy + 14); ctx.stroke();
}
ctx.font = varFont; ctx.fillStyle = col; ctx.textAlign = 'center';
ctx.fillText('fixed end', xFar, yBase - 46);
} else {
var endY = clamp(centerY + yScale * displacement(xFar), 4, CH - 4);
ctx.beginPath(); ctx.arc(xFar, endY, 8, 0, 2 * Math.PI); ctx.lineWidth = 3; ctx.stroke();
ctx.font = varFont; ctx.fillStyle = col; ctx.textAlign = 'center';
ctx.fillText('free end', xFar, yBase - 46);
}
ctx.textAlign = 'left';
}
function handR(hx, hy, hw0, hh0, col) {
ctx.fillStyle = col; ctx.strokeStyle = col;
ctx.beginPath();
ctx.moveTo(hx + (36 - 65) * hw0 / 65, hy + 0 * hh0 / 41);
ctx.lineTo(hx + (44 - 65) * hw0 / 65, hy + 0 * hh0 / 41);
ctx.lineTo(hx + (46 - 65) * hw0 / 65, hy + 1 * hh0 / 41);
ctx.lineTo(hx + (51 - 65) * hw0 / 65, hy + 1 * hh0 / 41);
ctx.lineTo(hx + (56 - 65) * hw0 / 65, hy + 2 * hh0 / 41);
ctx.lineTo(hx + (62 - 65) * hw0 / 65, hy + 8 * hh0 / 41);
ctx.lineTo(hx + (63 - 65) * hw0 / 65, hy + 10 * hh0 / 41);
ctx.lineTo(hx + (64 - 65) * hw0 / 65, hy + 12 * hh0 / 41);
ctx.lineTo(hx + (65 - 65) * hw0 / 65, hy + 16 * hh0 / 41);
ctx.lineTo(hx + (61 - 65) * hw0 / 65, hy + 17 * hh0 / 41);
ctx.lineTo(hx + (56 - 65) * hw0 / 65, hy + 17 * hh0 / 41);
ctx.lineTo(hx + (57 - 65) * hw0 / 65, hy + 20 * hh0 / 41);
ctx.lineTo(hx + (56 - 65) * hw0 / 65, hy + 22 * hh0 / 41);
ctx.lineTo(hx + (54 - 65) * hw0 / 65, hy + 24 * hh0 / 41);
ctx.lineTo(hx + (51 - 65) * hw0 / 65, hy + 24 * hh0 / 41);
ctx.lineTo(hx + (50 - 65) * hw0 / 65, hy + 27 * hh0 / 41);
ctx.lineTo(hx + (49 - 65) * hw0 / 65, hy + 27 * hh0 / 41);
ctx.lineTo(hx + (48 - 65) * hw0 / 65, hy + 28 * hh0 / 41);
ctx.lineTo(hx + (47 - 65) * hw0 / 65, hy + 28 * hh0 / 41);
ctx.lineTo(hx + (47 - 65) * hw0 / 65, hy + 33 * hh0 / 41);
ctx.lineTo(hx + (46 - 65) * hw0 / 65, hy + 35 * hh0 / 41);
ctx.lineTo(hx + (43 - 65) * hw0 / 65, hy + 35 * hh0 / 41);
ctx.lineTo(hx + (42 - 65) * hw0 / 65, hy + 36 * hh0 / 41);
ctx.lineTo(hx + (38 - 65) * hw0 / 65, hy + 36 * hh0 / 41);
ctx.lineTo(hx + (38 - 65) * hw0 / 65, hy + 37 * hh0 / 41);
ctx.lineTo(hx + (37 - 65) * hw0 / 65, hy + 36 * hh0 / 41);
ctx.lineTo(hx + (36 - 65) * hw0 / 65, hy + 37 * hh0 / 41);
ctx.lineTo(hx + (34 - 65) * hw0 / 65, hy + 38 * hh0 / 41);
ctx.lineTo(hx + (32 - 65) * hw0 / 65, hy + 39 * hh0 / 41);
ctx.lineTo(hx + (30 - 65) * hw0 / 65, hy + 39 * hh0 / 41);
ctx.lineTo(hx + (27 - 65) * hw0 / 65, hy + 38 * hh0 / 41);

function displayWaveData(x, y, w, h) {

function drawCaliperReadout(cx, cy, text, col) {
ctx.font = varFont;

ctx.fillText(text, cx, cy + 1);

function drawXCaliper(col) {

ctx.beginPath(); ctx.moveTo(x1, y - h / 2); ctx.lineTo(x1, y + h / 2); ctx.stroke();
ctx.beginPath(); ctx.moveTo(x2, y - h / 2); ctx.lineTo(x2, y + h / 2); ctx.stroke();

function drawYCaliper(col) {
var x = yCal.bx, y1 = yCal.y1, y2 = yCal.y2, w = yCal.jawW;
var lo = Math.min(y1, y2), hi = Math.max(y1, y2);
ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(x, lo); ctx.lineTo(x, hi); ctx.stroke();
ctx.beginPath(); ctx.moveTo(x - w / 2, y1); ctx.lineTo(x + w / 2, y1); ctx.stroke();
ctx.beginPath(); ctx.moveTo(x - w / 2, y2); ctx.lineTo(x + w / 2, y2); ctx.stroke();

function hitTest(px0, py0, x, y, r0) { var dx = px0 - x, dy = py0 - y; return (dx * dx + dy * dy) <= r0 * r0; }
function pointInBox(px0, py0, box) { return box && px0 >= box.x && px0 <= box.x + box.w && py0 >= box.y && py0 <= box.y + box.h; }
function checkIfCalipers(x, y) {
var jawR = 9;
if (addXCalFlag) {
if (hitTest(x, y, xCal.x1, xCal.by, jawR)) { dragging = { tool: 'x', part: 'j1' }; return; }
if (hitTest(x, y, xCal.x2, xCal.by, jawR)) { dragging = { tool: 'x', part: 'j2' }; return; }
if (pointInBox(x, y, xCal.box)) { dragging = { tool: 'x', part: 'beam' }; return; }

if (addYCalFlag) {
if (hitTest(x, y, yCal.bx, yCal.y1, jawR)) { dragging = { tool: 'y', part: 'j1' }; return; }
if (hitTest(x, y, yCal.bx, yCal.y2, jawR)) { dragging = { tool: 'y', part: 'j2' }; return; }

function draw() {

addGrid(2 * CH, CW, 10, 10, 0, 0, '#dddddd');
addXYaxis(CH, CW, CH / 4, CW / 4, axisCol);

function narrate() {
var endNote = (endType === 'fixed') ? 'a fixed wall' : 'a free ring on a pole';
var msg = 'T=' + Tension.toFixed(0) + ' N, \u03BC=' + mu.toFixed(0) + ' g/m, v=' + v.toFixed(1) + ' m/s. ';
msg += 'Driving at ' + freq.toFixed(1) + ' Hz against ' + endNote + '. ';
msg += nearRes ? ('Near resonance, harmonic n=' + nearestHarmonicNumber() + '.') : 'Sweep the frequency slider to find resonance.';
rwA11y0922.narrate(msg);
}
function setPlayLabel(isPlaying) {
var b = document.getElementById('rwPlayBtn0922'); if (!b) return;
b.innerHTML = isPlaying ? '\u23F8 Pause' : '\u25B6 Play';
b.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
}
function runSim() { draw(); if (runFlag === 1) timer = window.setTimeout(runSim, runRate); }

function stepBack() {

}
function reset() {

function setEnd(e)       { endType = e; recompute(); draw(); narrate(); }

function setAmp(val)     { A0 = parseFloat(val); document.getElementById('rwAmpValue0922').innerHTML = A0.toFixed(1); draw(); }

function toggleDeltaX(cb) {

rwA11y0922.narrate('Vertical-distance caliper ' + (cb.checked ? 'shown, with a live reading.' : 'hidden.'));

function reactionDown(x, y) {

function reactionMove(x, y) {
var r0 = canvas.getBoundingClientRect(); x -= r0.left; y -= r0.top;

else if (dragging.part === 'beam') xCal.by = y;

function reactionUp() {

function init() {
