  <div class="footer820">

        <input type="range" id="rcF820" min="50" max="5000" step="10" value="1200"

        <span id="rcVmVal820">5</span>

    <div class="rowgrp820">

        <select id="rcV1820" onchange="rcSim820.redraw();">
          <option>0.5</option><option selected>1</option><option>2</option><option>5</option>
        </select>
      </label>
      <label>CH2 (V<sub>C</sub>) V/div:
        <select id="rcV2820" onchange="rcSim820.redraw();">
          <option>0.5</option><option selected>1</option><option>2</option><option>5</option>
        </select>
      </label>
      <label>Time/div (ms):
        <select id="rcT820" onchange="rcSim820.redraw();">
          <option>0.1</option><option>0.2</option><option selected>0.5</option><option>1</option><option>2</option>
        </select>
      </label>
      <label class="rc_chk820"><input type="checkbox" id="rcTol820" onchange="rcSim820.rst();"> Simulate component tolerance (experimental error)</label>
    </div>
  </div>
</div>

<!-- ════════ A11Y CONTROLLER ════════ -->
<script>
  var rcA11y820 = (function(){
    var ROOT = null;
    var states = { hc:false, lm:false, cb:false, nr:true };
    var THEMES = {
      hc:{'--rc-bg':'#000','--rc-scope-bg':'#000','--rc-grid':'#444','--rc-vr':'#ffff00','--rc-vc':'#00e8ff','--rc-src':'#fff','--rc-text':'#fff','--rc-struct':'#fff','--rc-good':'#30ff70','--rc-toolbar-bg':'#000','--rc-cursor':'#ff66ff'},
      lm:{'--rc-bg':'#f0f0f0','--rc-scope-bg':'#12261a','--rc-grid':'#33553f','--rc-vr':'#c98a00','--rc-vc':'#0090a0','--rc-src':'#555','--rc-text':'#000','--rc-struct':'#000','--rc-good':'#157a30','--rc-toolbar-bg':'#444','--rc-cursor':'#b030b0'},
      cb:{'--rc-bg':'#fff','--rc-scope-bg':'#0b1a0f','--rc-grid':'#2c4a34','--rc-vr':'#d55e00','--rc-vc':'#0072b2','--rc-src':'#666','--rc-text':'#000','--rc-struct':'#333','--rc-good':'#009e73','--rc-toolbar-bg':'#222','--rc-cursor':'#cc79a7'}
    };
    var DEFS = {'--rc-bg':'#fff','--rc-scope-bg':'#0b1a0f','--rc-grid':'#2c4a34','--rc-vr':'#e0a800','--rc-vc':'#00b7c2','--rc-src':'#888','--rc-text':'#111','--rc-struct':'#111','--rc-good':'#1a8a3a','--rc-toolbar-bg':'#222','--rc-cursor':'#d33fd3'};
    function applyVars(k,on){ if(!ROOT)return; var v=THEMES[k]; for(var p in v) ROOT.style.setProperty(p,on?v[p]:DEFS[p]); }
    function styleBtn(id,on){
      var b=document.getElementById(id); if(!b)return;
      b.style.background=on?'rgba(0,232,208,.12)':'#2a2e3a';
      b.style.borderColor=on?'#00e8d0':'#404a60';
      b.style.color=on?'#00e8d0':'#7a8aaa';
      b.setAttribute('aria-pressed',on?'true':'false');
    }
    function applyNarBar(){
      var nb=document.getElementById('rcNarBar820');
      if(nb) nb.style.display=states.nr?'block':'none';
      var btn=document.getElementById('rcBtnNR820');
      if(btn){ btn.textContent='NARRATION: '+(states.nr?'ON':'OFF'); styleBtn('rcBtnNR820',states.nr); }
    }
    function apply(){
      if(!ROOT)return;
      applyVars('hc',states.hc); applyVars('lm',states.lm); applyVars('cb',states.cb);
      applyNarBar();
      styleBtn('rcBtnHC820',states.hc);
      styleBtn('rcBtnLM820',states.lm);
      styleBtn('rcBtnCB820',states.cb);
    }
    return {
      init:function(){ ROOT=document.getElementById('rcRoot820'); apply(); },
      toggle:function(k){
        states[k]=!states[k];
        if(k==='hc'&&states.hc) states.lm=false;
        if(k==='lm'&&states.lm) states.hc=false;
        apply();
        if(window.rcSim820) window.rcSim820.redraw();
      },
      narrate:function(msg){
        if(!states.nr)return;
        var nb=document.getElementById('rcNarBar820');
        if(nb) nb.textContent=msg;
      },
      col:function(prop,def){
        if(!ROOT) return def;
        var v=ROOT.style.getPropertyValue(prop);
        return (v&&v.trim())?v.trim():def;
      }
    };
  })();
</script>
<!-- ════════ SIMULATION ════════
Pattern: mirrors the working VGG (Van de Graaff) example.
- var simObj = function() { ... rst(); return {rst,pl,ps,step,...}; }
- var simObj820 = new simObj();
- Animation: recursive window.setTimeout(runMotion, 40) guarded by runFlag
- rst() is called immediately inside the constructor (no deferred boot)
-->
<script>
  var rcGen = function() {
    var canvas  = document.getElementById('rcCanvas820');
    var ctx     = canvas.getContext('2d');
    var eqPanel = document.getElementById('rcEqPanel820');
    var W = canvas.width, H = canvas.height;
    var timer, runFlag = 0;
    var tab = 'scope';                 /* 'scope' | 'phasor' | 'equations' */
    var sweepPhase = 0;                /* animated beam position, 0..1 across the screen */
    var phasorAngle = 0;               /* animated rotation for the phasor view, radians */
    /* ── experimental-error (component tolerance) state ── */
    var errR = 0, errC = 0, errF = 0, errScope = 0;
    function rollTolerances() {
      errR = (Math.random()*2-1) * 0.05;   /* resistor  +/-5%  */
      errC = (Math.random()*2-1) * 0.10;   /* capacitor +/-10% (typical electrolytic/film tol.) */
      errF = (Math.random()*2-1) * 0.01;   /* function-gen freq accuracy +/-1% */
      errScope = (Math.random()*2-1) * 0.02; /* scope vertical reading noise +/-2% */
    }
    rollTolerances();
    /* ── cursor state (phase measurement tool, scope tab only) ── */
    var cur1X = null, cur2X = null, dragCur = null;
    /* ── color helper ── */
    function c(prop, def) { return rcA11y820.col(prop, def); }
    function tolOn() { var el=document.getElementById('rcTol820'); return el && el.checked; }
    /* ── read current control values ── */
    function controls() {
      return {
        Rset:  parseFloat(document.getElementById('rcR820').value),
        Cset:  parseFloat(document.getElementById('rcC820').value),   /* nF */
        Fset:  parseFloat(document.getElementById('rcF820').value),
        Vm:    parseFloat(document.getElementById('rcVm820').value),
        v1div: parseFloat(document.getElementById('rcV1820').value),
        v2div: parseFloat(document.getElementById('rcV2820').value),
        tdiv:  parseFloat(document.getElementById('rcT820').value)    /* ms */
      };
    }
    /* ── physics ── */
    function physics() {
      var k = controls();
      var tol = tolOn();
      var R = k.Rset * (1 + (tol ? errR : 0));
      var C = k.Cset * 1e-9 * (1 + (tol ? errC : 0));
      var f = k.Fset * (1 + (tol ? errF : 0));
      var w = 2 * Math.PI * f;
      var Xc = 1 / (w * C);
      var Z  = Math.sqrt(R*R + Xc*Xc);
      var phi = Math.atan(Xc / R);           /* current & VR lead the source by phi (rad) */
      var Im  = k.Vm / Z;
      var VRm = Im * R;
      var VCm = Im * Xc;
      return { k:k, R:R, C:C, f:f, w:w, Xc:Xc, Z:Z, phi:phi, Im:Im, VRm:VRm, VCm:VCm };
    }
    /* ── schematic (always drawn, left panel) ── */
    function drawSchematic(p) {
      var x0 = 10, colX = 205;
      ctx.strokeStyle = c('--rc-struct','#111'); ctx.fillStyle = c('--rc-struct','#111');
      ctx.lineWidth = 2; ctx.font = '12px monospace'; ctx.textAlign = 'left';
      /* function generator symbol */
      var gy = 55;
      ctx.beginPath(); ctx.arc(colX-100, gy, 26, 0, 2*Math.PI); ctx.stroke();
      ctx.beginPath();
      for (var i=0;i<=20;i++){
        var ang = -Math.PI + i*(2*Math.PI/20);
        var xx = colX - 116 + i*1.6;
        var yy = gy + 10*Math.sin(i*0.9);
      }
      ctx.moveTo(colX-116, gy);
      for (var i2=0;i2<=16;i2++){ ctx.lineTo(colX-116+i2*2, gy - 8*Math.sin(i2*Math.PI/4)); }
      ctx.strokeStyle = c('--rc-src','#888'); ctx.stroke();
      ctx.fillStyle = c('--rc-struct','#111');
      ctx.fillText('FG', colX-110, gy+42);
      ctx.fillText('v(t) = Vm sin(\u03C9t)', colX-152, gy+58);
      /* top wire */
      ctx.strokeStyle = c('--rc-struct','#111');
      ctx.beginPath(); ctx.moveTo(colX-74, gy); ctx.lineTo(colX, gy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX, gy); ctx.lineTo(colX, 100); ctx.stroke();
      /* resistor zigzag (vertical, y 100-170) */
      var rY0 = 100, rY1 = 170;
      ctx.beginPath(); ctx.moveTo(colX, rY0);
      var seg = (rY1-rY0)/8, dir=1;
      for (var s=0;s<8;s++){ ctx.lineTo(colX + dir*10, rY0 + seg*(s+1)); dir*=-1; }
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX - dir*10, rY0 + seg*(s)); ctx.lineTo(colX, rY1+seg); ctx.stroke();
      ctx.fillText('R', colX+16, (rY0+rY1)/2+4);
      /* node A -> capacitor (y 170-260) */
      var nodeY = 180, capY0 = 205, capY1 = 225, capY2 = 300;
      ctx.beginPath(); ctx.moveTo(colX, rY1+seg); ctx.lineTo(colX, capY0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX-18, capY0); ctx.lineTo(colX+18, capY0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX-18, capY1); ctx.lineTo(colX+18, capY1); ctx.stroke();
      ctx.fillText('C', colX+24, (capY0+capY1)/2+4);
      ctx.beginPath(); ctx.moveTo(colX, capY1); ctx.lineTo(colX, capY2); ctx.stroke();
      /* ground bar + return wire to generator */
      ctx.beginPath(); ctx.moveTo(colX-14, capY2); ctx.lineTo(colX+14, capY2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX-9, capY2+5); ctx.lineTo(colX+9, capY2+5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX-4, capY2+10); ctx.lineTo(colX+4, capY2+10); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(colX, capY2); ctx.lineTo(30, capY2);
      ctx.lineTo(30, gy); ctx.lineTo(colX-126, gy);
      ctx.stroke();
      /* CH1 probe across R (yellow) */
      ctx.strokeStyle = c('--rc-vr','#e0a800'); ctx.fillStyle = c('--rc-vr','#e0a800');
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(colX+40, rY0); ctx.lineTo(colX+60, rY0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX+40, rY1); ctx.lineTo(colX+60, rY1); ctx.stroke();
      ctx.beginPath(); ctx.arc(colX+40, rY0, 3, 0, 2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.arc(colX+40, rY1, 3, 0, 2*Math.PI); ctx.fill();
      ctx.font = 'bold 12px monospace';
      ctx.fillText('CH1', colX+64, (rY0+rY1)/2);
      ctx.font = '11px monospace';
      ctx.fillText('(V\u1D63)', colX+64, (rY0+rY1)/2+14);
      /* CH2 probe across C (cyan) */
      ctx.strokeStyle = c('--rc-vc','#00b7c2'); ctx.fillStyle = c('--rc-vc','#00b7c2');
      ctx.beginPath(); ctx.moveTo(colX+40, capY0); ctx.lineTo(colX+70, capY0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(colX+40, capY1); ctx.lineTo(colX+70, capY1); ctx.stroke();
      ctx.beginPath(); ctx.arc(colX+40, capY0, 3, 0, 2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.arc(colX+40, capY1, 3, 0, 2*Math.PI); ctx.fill();
      ctx.font = 'bold 12px monospace';
      ctx.fillText('CH2', colX+74, (capY0+capY1)/2+4);
      ctx.font = '11px monospace';
      ctx.fillText('(V\u1D04)', colX+74, (capY0+capY1)/2+18);
      /* component values printed under schematic */
      ctx.fillStyle = c('--rc-text','#111'); ctx.font = '12px monospace';
      ctx.fillText('R = '+p.R.toFixed(0)+' \u03A9', 20, 340);
      ctx.fillText('C = '+(p.C*1e9).toFixed(1)+' nF', 20, 358);
      ctx.fillText('f = '+p.f.toFixed(1)+' Hz', 20, 376);
      if (tolOn()) {
        ctx.fillStyle = '#a04a00'; ctx.font = 'italic 11px monospace';
        ctx.fillText('(values include component', 20, 396);
        ctx.fillText('tolerance / meas. error)', 20, 410);
      }
    }
    /* ── oscilloscope panel (right side, scope tab) ── */
    var scopeX = 350, scopeY = 8, scopeW = 340, scopeH = 300;
    function timeToX(tSec, tdivMs) {
      var halfSpanSec = (tdivMs/1000) * 5;
      return scopeX + scopeW/2 + (tSec/halfSpanSec) * (scopeW/2);
    }
    function xToTime(x, tdivMs) {
      var halfSpanSec = (tdivMs/1000) * 5;
      return ((x - (scopeX+scopeW/2)) / (scopeW/2)) * halfSpanSec;
    }
    function drawScopePanel(p) {
      ctx.fillStyle = c('--rc-scope-bg','#0b1a0f');
      ctx.fillRect(scopeX, scopeY, scopeW, scopeH);
      ctx.strokeStyle = c('--rc-grid','#2c4a34'); ctx.lineWidth = 1;
      var cols = 10, rows = 8;
      for (var i3=0;i3<=cols;i3++){
        var gx = scopeX + i3*scopeW/cols;
        ctx.beginPath(); ctx.moveTo(gx, scopeY); ctx.lineTo(gx, scopeY+scopeH); ctx.stroke();
      }
      for (var j3=0;j3<=rows;j3++){
        var gyy = scopeY + j3*scopeH/rows;
        ctx.beginPath(); ctx.moveTo(scopeX, gyy); ctx.lineTo(scopeX+scopeW, gyy); ctx.stroke();
      }
      var midY = scopeY + scopeH/2;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(scopeX, midY); ctx.lineTo(scopeX+scopeW, midY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(scopeX+scopeW/2, scopeY); ctx.lineTo(scopeX+scopeW/2, scopeY+scopeH); ctx.stroke();
      var pxPerDivY = scopeH/rows;
      var noise = tolOn() ? errScope : 0;
      function yFor(v, voltsDiv) { return midY - (v*(1+noise)/voltsDiv) * pxPerDivY; }
      /* CH1 trace: VR(t) */
      ctx.strokeStyle = c('--rc-vr','#e0a800'); ctx.lineWidth = 2; ctx.beginPath();
      for (var xpix=scopeX; xpix<=scopeX+scopeW; xpix++) {
        var tS = xToTime(xpix, p.k.tdiv);
        var v = p.VRm * Math.sin(p.w*tS + p.phi);
        var yy2 = yFor(v, p.k.v1div);
        if (xpix===scopeX) ctx.moveTo(xpix, yy2); else ctx.lineTo(xpix, yy2);
      }
      ctx.stroke();
      /* CH2 trace: VC(t) */
      ctx.strokeStyle = c('--rc-vc','#00b7c2'); ctx.beginPath();
      for (var xpix2=scopeX; xpix2<=scopeX+scopeW; xpix2++) {
        var tS2 = xToTime(xpix2, p.k.tdiv);
        var v2 = p.VCm * Math.sin(p.w*tS2 + p.phi - Math.PI/2);
        var yy3 = yFor(v2, p.k.v2div);
        if (xpix2===scopeX) ctx.moveTo(xpix2, yy3); else ctx.lineTo(xpix2, yy3);
      }
      ctx.stroke();
      /* animated sweep beam dot (visual only, runs when Play is on) */
      var beamX = scopeX + sweepPhase*scopeW;
      var tB = xToTime(beamX, p.k.tdiv);
      var vB = p.VRm * Math.sin(p.w*tB + p.phi);
      ctx.fillStyle = c('--rc-vr','#e0a800');
      ctx.beginPath(); ctx.arc(beamX, yFor(vB,p.k.v1div), 3, 0, 2*Math.PI); ctx.fill();
      /* cursors */
      ctx.font='11px monospace';
      if (cur1X!==null) drawCursor(cur1X, '1');
      if (cur2X!==null) drawCursor(cur2X, '2');
      /* legend / settings text */
      ctx.textAlign='left'; ctx.font='11px monospace';
      ctx.fillStyle = c('--rc-vr','#e0a800');
      ctx.fillText('CH1: V\u1D63  '+p.k.v1div+' V/div', scopeX+4, scopeY+scopeH+14);
      ctx.fillStyle = c('--rc-vc','#00b7c2');
      ctx.fillText('CH2: V\u1D04  '+p.k.v2div+' V/div', scopeX+150, scopeY+scopeH+14);
      ctx.fillStyle = c('--rc-text','#111');
      ctx.fillText('Time/div: '+p.k.tdiv+' ms', scopeX+4, scopeY+scopeH+28);
      ctx.fillText('Drag on the screen to place phase-measurement cursors.', scopeX+4, scopeY+scopeH+42);
    }
    function drawCursor(x, label) {
      ctx.strokeStyle = c('--rc-cursor','#d33fd3'); ctx.lineWidth = 1;
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(x, scopeY); ctx.lineTo(x, scopeY+scopeH); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = c('--rc-cursor','#d33fd3');
      ctx.fillText(label, x-3, scopeY-2);
    }
    /* ── phasor panel ── */
    function drawPhasorPanel(p) {
      var cx = scopeX + scopeW/2, cy = scopeY + scopeH/2 + 10;
      ctx.strokeStyle = c('--rc-grid','#2c4a34'); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(scopeX, cy); ctx.lineTo(scopeX+scopeW, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, scopeY); ctx.lineTo(cx, scopeY+scopeH); ctx.stroke();
      var maxV = Math.max(p.k.Vm, p.VRm, p.VCm, 0.01);
      var scale = (scopeW/2 - 20) / maxV;
      var rot = phasorAngle;
      function arrow(angRad, mag, color, label) {
        var ex = cx + mag*scale*Math.cos(angRad - rot);
        var ey = cy - mag*scale*Math.sin(angRad - rot);
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
        var hAng = Math.atan2(cy-ey, ex-cx);
        ctx.beginPath();
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex-9*Math.cos(hAng-0.3), ey+9*Math.sin(hAng-0.3));
        ctx.lineTo(ex-9*Math.cos(hAng+0.3), ey+9*Math.sin(hAng+0.3));
        ctx.closePath(); ctx.fill();
        ctx.font='bold 12px monospace';
        ctx.fillText(label, ex+ (ex>=cx?6:-24), ey-(ey<cy? 4 : -14));
      }
      arrow(0, p.k.Vm, c('--rc-src','#888'), 'v(t)');
      arrow(p.phi, p.VRm, c('--rc-vr','#e0a800'), 'V\u1D63');
      arrow(p.phi - Math.PI/2, p.VCm, c('--rc-vc','#00b7c2'), 'V\u1D04');
      /* angle arc for phi between v(t) and VR */
      ctx.strokeStyle = c('--rc-text','#111'); ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx, cy, 26, -rot, p.phi-rot, false); ctx.stroke();
      ctx.font='12px monospace';
      ctx.fillStyle = c('--rc-text','#111');
      ctx.fillText('\u03C6 = '+(p.phi*180/Math.PI).toFixed(1)+'\u00B0', cx+30, cy-30);
      ctx.font='12px monospace';
      ctx.fillText('\u2220(V\u1D63 \u2192 V\u1D04) = 90.0\u00B0 (always, for series RC)', scopeX+4, scopeY+scopeH+18);
      ctx.fillText('\u2220(v \u2192 V\u1D63) = \u03C6 = '+(p.phi*180/Math.PI).toFixed(1)+'\u00B0  (changes with frequency)', scopeX+4, scopeY+scopeH+34);
    }
    /* ── shared readout strip (bottom of canvas, all tabs) ── */
    function drawReadout(p) {
      var y0 = 380;
      ctx.fillStyle = c('--rc-text','#111'); ctx.font='12px monospace'; ctx.textAlign='left';
      ctx.fillText('Xc = '+p.Xc.toFixed(1)+' \u03A9    Z = '+p.Z.toFixed(1)+' \u03A9    \u03C6 = '+(p.phi*180/Math.PI).toFixed(1)+'\u00B0', 350, y0);
      ctx.fillText('V\u1D63(pk) = '+p.VRm.toFixed(2)+' V    V\u1D04(pk) = '+p.VCm.toFixed(2)+' V', 350, y0+16);
      var balanced = Math.abs(p.Xc - p.R)/p.R < 0.03;
      if (balanced) {
        ctx.fillStyle = c('--rc-good','#1a8a3a'); ctx.font='bold 13px monospace';
        ctx.fillText('\u2713 Xc \u2248 R  \u2192  V\u1D63 \u2248 V\u1D04  (\u03C6 \u2248 45\u00B0)  BALANCED', 350, y0+38);
      } else {
        ctx.fillStyle = c('--rc-text','#111'); ctx.font='12px monospace';
        var hint = p.Xc > p.R ? 'Raise f (or lower C) to bring Xc down toward R.' : 'Lower f (or raise C) to bring Xc up toward R.';
        ctx.fillText(hint, 350, y0+38);
      }
      /* cursor readout */
      if (cur1X!==null && cur2X!==null) {
        var t1 = xToTime(cur1X, p.k.tdiv), t2 = xToTime(cur2X, p.k.tdiv);
        var dt = Math.abs(t2-t1);
        var dphi = (dt * p.f * 360) % 360;
        ctx.fillStyle = c('--rc-cursor','#d33fd3'); ctx.font='12px monospace';
        ctx.fillText('Cursors: \u0394t = '+(dt*1000).toFixed(3)+' ms   \u21D2  \u0394\u03C6 = '+dphi.toFixed(1)+'\u00B0', 350, y0+56);
      }
    }
    /* ── equations panel (DOM) ── */
    function fmtNum(x, d) { return (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString(); }
    function renderEquations(p) {
      var wRound = fmtNum(p.w,1);
      var html = '';
      html += '<h4>Circuit relations</h4>';
      html += '<div class="rc_eqline820">X<sub>C</sub> = 1 / (2&pi;f C) = '+p.Xc.toFixed(1)+' &Omega;</div>';
      html += '<div class="rc_eqline820">Z = &radic;(R&sup2; + X<sub>C</sub>&sup2;) = '+p.Z.toFixed(1)+' &Omega;</div>';
      html += '<div class="rc_eqline820">&phi; = arctan(X<sub>C</sub>/R) = '+(p.phi*180/Math.PI).toFixed(2)+'&deg;  (current &amp; V<sub>R</sub> lead the source by &phi;)</div>';
      html += '<div class="rc_eqline820">I<sub>m</sub> = V<sub>m</sub> / Z = '+(p.Im*1000).toFixed(2)+' mA</div>';
      html += '<h4>Time-domain waveforms</h4>';
      html += '<div class="rc_eqline820">v(t) = '+p.k.Vm.toFixed(2)+' sin('+wRound+' t)  V</div>';
      html += '<div class="rc_eqline820">v<sub>R</sub>(t) = I<sub>m</sub> R sin(&omega;t + &phi;) = '+p.VRm.toFixed(2)+' sin('+wRound+' t + '+(p.phi).toFixed(3)+')  V</div>';
      html += '<div class="rc_eqline820">v<sub>C</sub>(t) = I<sub>m</sub> X<sub>C</sub> sin(&omega;t + &phi; &minus; 90&deg;) = '+p.VCm.toFixed(2)+' sin('+wRound+' t + '+(p.phi-Math.PI/2).toFixed(3)+')  V</div>';
      html += '<h4>Key facts to verify experimentally</h4>';
      html += '<div class="rc_eqline820">&bull; v<sub>C</sub> always lags v<sub>R</sub> by exactly 90&deg;, for any R, C, f.</div>';
      html += '<div class="rc_eqline820">&bull; When you tune f so that X<sub>C</sub> = R, then V<sub>R</sub>(pk) = V<sub>C</sub>(pk), and &phi; = 45&deg; (halfway between 0&deg; and 90&deg;).</div>';
      html += '<div class="rc_eqline820">&bull; At f &rarr; 0, X<sub>C</sub> &rarr; &infin;, &phi; &rarr; 90&deg; (nearly all of v(t) appears across C).</div>';
      html += '<div class="rc_eqline820">&bull; At f &rarr; &infin;, X<sub>C</sub> &rarr; 0, &phi; &rarr; 0&deg; (nearly all of v(t) appears across R).</div>';
      html += '<h4>Currently set values</h4>';
      html += '<div class="rc_eqline820">R = '+p.R.toFixed(0)+' &Omega;,  C = '+(p.C*1e9).toFixed(2)+' nF,  f = '+p.f.toFixed(1)+' Hz,  V<sub>m</sub> = '+p.k.Vm.toFixed(2)+' V'+(tolOn()?'  <i>(includes simulated component tolerance)</i>':'')+'</div>';
      eqPanel.innerHTML = html;
    }
    /* ── full redraw ── */
    function drawFrame() {
      var p = physics();
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = c('--rc-bg','#fff'); ctx.fillRect(0,0,W,H);
      if (tab === 'equations') {
        canvas.style.display = 'none';
        eqPanel.style.display = 'block';
        renderEquations(p);
        return;
      }
      canvas.style.display = 'block';
      eqPanel.style.display = 'none';
      drawSchematic(p);
      if (tab === 'scope') drawScopePanel(p); else drawPhasorPanel(p);
      drawReadout(p);
    }
    /* ── narration ── */
    var frameCount = 0, narrationEvery = 60, lastNarratedTab = null, lastNarratedBalanced = null;
    function sceneNarration(force) {
      var p = physics();
      var balanced = Math.abs(p.Xc - p.R)/p.R < 0.03;
      if (!force && tab === lastNarratedTab && balanced === lastNarratedBalanced) return;
      lastNarratedTab = tab; lastNarratedBalanced = balanced;
      var msg = '';
      if (tab === 'scope') {
        msg = 'Oscilloscope showing CH1, the resistor voltage in yellow, and CH2, the capacitor voltage in cyan. ';
        msg += 'At the current frequency of '+p.f.toFixed(0)+' Hz, the reactance Xc is '+p.Xc.toFixed(0)+' ohms versus R of '+p.R.toFixed(0)+' ohms. ';
        msg += balanced ? 'The two traces now have equal amplitude -- the balanced condition Xc equals R has been reached.'
        : 'The traces have unequal amplitude; adjust frequency to make Xc equal R.';
      } else if (tab === 'phasor') {
        msg = 'Phasor diagram showing the source voltage, the resistor voltage leading it by phi, and the capacitor voltage trailing the resistor voltage by exactly ninety degrees. Current phi is '+(p.phi*180/Math.PI).toFixed(0)+' degrees.';
      } else {
        msg = 'Equations panel showing the live time-domain expressions for the source, resistor, and capacitor voltages.';
      }
      rcA11y820.narrate(msg);
    }
    /* ── animation loop ── */
    function runMotion() {
      sweepPhase += 0.02; if (sweepPhase > 1) sweepPhase = 0;
      phasorAngle += 0.03;
      frameCount++;
      drawFrame();
      if (frameCount % narrationEvery === 0) sceneNarration(false);
      if (runFlag === 1) timer = window.setTimeout(runMotion, 40);
    }
    function pl() { window.clearTimeout(timer); runFlag = 1; runMotion(); }
    function ps() { window.clearTimeout(timer); runFlag = 0; }
    function step() {
      window.clearTimeout(timer); runFlag = 0;
      sweepPhase += 0.05; if (sweepPhase > 1) sweepPhase = 0;
      phasorAngle += 0.08;
      drawFrame(); sceneNarration(true);
    }
    function rst() {
      window.clearTimeout(timer); runFlag = 0;
      rollTolerances();
      sweepPhase = 0; phasorAngle = 0; cur1X = null; cur2X = null;
      drawFrame(); sceneNarration(true);
    }
    function redraw() { drawFrame(); }
    function setTab(t) {
      tab = t;
      ['scope','phasor','equations'].forEach(function(nm){
        var el = document.getElementById('rcTab'+nm.charAt(0).toUpperCase()+nm.slice(1)+'820');
        if (nm==='scope') el = document.getElementById('rcTabScope820');
        if (nm==='phasor') el = document.getElementById('rcTabPhasor820');
        if (nm==='equations') el = document.getElementById('rcTabEq820');
        if (el) el.classList.toggle('rc_tabon820', nm===t);
      });
      drawFrame(); sceneNarration(true);
    }
    function clearCursors() { cur1X = null; cur2X = null; drawFrame(); }
    /* ── mouse interaction for phase-measurement cursors ── */
    function localX(evt) {
      var rect = canvas.getBoundingClientRect();
      var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
      return cx * (canvas.width / rect.width);
    }
    canvas.addEventListener('mousedown', function(evt){
      if (tab !== 'scope') return;
      var x = localX(evt);
      if (x < scopeX || x > scopeX+scopeW) return;
      if (cur1X === null || Math.abs(x-cur1X) <= Math.abs(x-(cur2X===null?1e9:cur2X))) {
        if (cur1X === null) { cur1X = x; }
        else if (cur2X === null) { cur2X = x; }
        else { dragCur = Math.abs(x-cur1X) < Math.abs(x-cur2X) ? 1 : 2; }
      }
      if (cur1X !== null && cur2X !== null && dragCur === null) {
        dragCur = Math.abs(x-cur1X) < Math.abs(x-cur2X) ? 1 : 2;
      }
      drawFrame();
    });
    canvas.addEventListener('mousemove', function(evt){
      if (tab !== 'scope' || dragCur === null) return;
      var x = Math.max(scopeX, Math.min(scopeX+scopeW, localX(evt)));
      if (dragCur===1) cur1X = x; else cur2X = x;
      drawFrame();
    });
    window.addEventListener('mouseup', function(){ dragCur = null; });
    /* boot */
    rst();
    return { pl:pl, ps:ps, step:step, rst:rst, redraw:redraw, setTab:setTab, clearCursors:clearCursors };
  };
  var rcSim820 = new rcGen();
</script>
<script>
  rcA11y820.init();
</script>
